name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # We define the specific configurations here
        include:
          - os: windows-latest
            c_compiler: gcc
            shell: msys2 {0}
          - os: ubuntu-latest
            c_compiler: gcc
            shell: bash
          - os: ubuntu-latest
            c_compiler: clang
            shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Set reusable strings
        id: strings
        shell: bash # Bash is always available on GitHub runners for simple logic
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        # Now we use the shell defined in our matrix
        shell: ${{ matrix.shell }}
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Build
        shell: ${{ matrix.shell }}
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }}

      - name: Test
        shell: ${{ matrix.shell }}
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest